# Every Monday: is there a newer epson_print_conf release than the vendored one?
# If so, open an issue (the owner gets an email). Updating stays a manual step:
#   python tools/update_upstream.py --apply   (shows model changes, runs tests)
name: Upstream check

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/^tag: //p' third_party/epson_print_conf/UPSTREAM.txt)
          latest=$(gh api repos/Ircama/epson_print_conf/releases/latest --jq .tag_name)
          echo "vendored: $current, upstream: $latest"
          [ "$latest" = "$current" ] && exit 0
          open=$(gh issue list --state open --search "$latest in:title" --json number --jq 'length')
          [ "$open" != "0" ] && exit 0
          gh issue create \
            --title "上游 epson_print_conf 有新版本 $latest / Upstream release $latest" \
            --body "当前使用 $current，上游已发布 $latest：https://github.com/Ircama/epson_print_conf/releases/tag/$latest

          更新方法：运行 \`python tools/update_upstream.py --apply\`，它会列出新增、删除和参数有变化的型号，并跑全部测试。测试通过后再打包发布。"
